[package]
name = "yt-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
ansi-to-tui = "8"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "json", "stream"], default-features = false }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
glob = "0.3"
anyhow = "1"
futures = "0.3"
tui-scrollview = "0.6"
ratatui-core = "0.1.0"
termimad = "0.30"
smart_quotes = "0.1"
arboard = "3"

[profile.release]
lto = true
strip = true
