[package]
name = "yt-gtk"
version = "0.1.0"
edition = "2024"

[dependencies]

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync"] }

# HTTP client
reqwest = { version = "0.12", features = ["gzip", "stream", "json"] }

# Used only for HTML entity unescaping of API titles (not for XML parsing).
quick-xml = { version = "0.37", features = ["escape-html"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-humanize = "0.2"

# Directories
directories = "6"

# Error handling
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# Futures utilities
futures = "0.3"
iso8601 = "0.6"

# Non-blocking channel compatible with both tokio and glib main contexts
async-channel = "2"
indexmap = "2"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9.1", package = "libadwaita", features = ["v1_5"] }

[dev-dependencies]
# `test-util` enables tokio::time::pause / start_paused in tests; not in `full`.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
