[package]
name = "yt-gtk"
version = "0.1.0"
edition = "2021"

[dependencies]
# GTK3
gtk = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = "0.18"
cairo-rs = "0.18"
pango = "0.18"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["gzip", "stream", "json"] }

# XML parsing for RSS
quick-xml = { version = "0.37", features = ["escape-html"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-humanize = "0.2"

# Directories
directories = "5"

# Error handling
anyhow = "1"
thiserror = "1"
log = "0.4"

# Futures utilities
futures = "0.3"
iso8601 = "0.6"

# Non-blocking channel compatible with both tokio and glib main contexts
async-channel = "2"
indexmap = "2"

[dev-dependencies]
# `test-util` enables tokio::time::pause / start_paused in tests; not in `full`.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
